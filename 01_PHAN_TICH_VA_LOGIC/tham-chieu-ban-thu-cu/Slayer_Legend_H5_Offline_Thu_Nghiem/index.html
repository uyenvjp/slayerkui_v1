<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10111d"><title>Slayer Legend — H5 Offline thử nghiệm</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--gold:#ffd57a;--text:#f9edda;--edge:#6d6485}*{box-sizing:border-box}body{margin:0;background:#080a13;color:var(--text);touch-action:manipulation;min-height:100vh}#wrap{position:relative;margin:auto;max-width:520px;height:100dvh;min-height:580px;overflow:hidden;border-inline:1px solid #3b365b;background:#17152b}canvas{width:100%;height:100%;display:block;touch-action:none}#top{position:absolute;inset:0 0 auto;z-index:2;padding:calc(12px + env(safe-area-inset-top)) 12px 0;pointer-events:none}#top .line{display:flex;justify-content:space-between;gap:9px;align-items:center}.plate{border:1px solid #716595b8;background:#111327da;border-radius:11px;padding:8px 11px;box-shadow:0 3px 14px #02030c90}.small{font-size:11px;color:#c6bfd4}.stats{font-size:14px;font-weight:900;color:var(--gold);white-space:nowrap}.bar{height:9px;background:#1c1720;border:1px solid #4a3545;border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#d83c61,#ff9474);width:100%;transition:width .18s}.strip{margin-top:8px;display:flex;justify-content:space-between;gap:5px}.strip .plate{flex:1;min-width:0;text-align:center;font-size:12px;padding:7px 2px}.strip b{color:#fce5a7}#bot{position:absolute;bottom:calc(9px + env(safe-area-inset-bottom));inset-inline:9px;z-index:3;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.btn{border:1px solid #8e7b68;min-height:59px;border-radius:12px;background:linear-gradient(180deg,#34334b,#181b2e);color:#f7ecd7;font-weight:800;font-size:12px;box-shadow:0 3px 0 #0e1020;cursor:pointer;line-height:1.4;padding:6px}.btn strong{color:#f4d18b;font-size:15px}.btn:active{transform:translateY(2px);box-shadow:none}.btn:disabled{opacity:.5}.btn.red{background:linear-gradient(180deg,#a24662,#5c243b);border-color:#ed8097}.btn.purple{background:linear-gradient(180deg,#7447a3,#33234e);border-color:#ac83ef}.btn.blue{background:linear-gradient(180deg,#42749f,#1b365c);border-color:#82b4f6}.wide{grid-column:span 3}.two{grid-column:span 2}#tip{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom));width:100%;text-align:center;font-weight:800;color:#ffdc90;text-shadow:0 2px 6px #000;padding:0 20px;pointer-events:none;font-size:13px}#offline{position:absolute;z-index:4;inset:0;background:#050612cf;display:none;align-items:center;justify-content:center;padding:24px}#offline>div{width:min(350px,100%);border:1px solid #b18c59;background:#18192b;border-radius:16px;padding:22px;text-align:center;box-shadow:0 18px 60px #000a}#offline h2{color:var(--gold);margin:4px 0 10px}#offline p{line-height:1.6;font-size:14px;color:#d8cfe6}.pill{border:1px solid #b5a2d8;padding:4px 8px;border-radius:10px;font-size:11px;color:#ddd2f5;background:#161329e6}#info{position:absolute;top:calc(110px + env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;color:#e3d2f6;text-shadow:0 2px 5px #08030f;font-size:13px;font-weight:800}.hint{color:#ada2bd;font-size:11px;margin-top:3px}
</style></head><body><main id="wrap"><canvas id="view" aria-label="Đấu trường pixel idle"></canvas><div id="top"><div class="line"><div class="plate" style="flex:1"><div style="display:flex;justify-content:space-between"><span class="small">KIẾM SĨ · LV <b id="lvl">1</b></span><b style="color:#ffb6bb" id="health">100/100</b></div><div class="bar"><i id="hpbar"></i></div></div><span class="pill">OFFLINE H5</span></div><div class="strip"><div class="plate">💰 <b id="gold">0</b></div><div class="plate">⚔️ ATK <b id="atk">12</b></div><div class="plate">🌊 Đợt <b id="wave">1</b></div><div class="plate">💀 Hạ <b id="kills">0</b></div></div></div><div id="info">Tự động đánh quái<div class="hint">Chạm màn hình để tấn công · Q / R dùng kỹ năng</div></div><div id="tip" aria-live="polite"></div><div id="bot"><button class="btn red" id="attack">⚔️ TẤN CÔNG<br><strong>Chém</strong></button><button class="btn blue" id="q">❄️ KIẾM KHÍ<br><strong id="qtext">Q</strong></button><button class="btn purple" id="r">🟣 LÔI BẠO<br><strong id="rtext">R</strong></button><button class="btn two" id="upgrade">⬆ Nâng sát thương<br><strong id="price">50 vàng</strong></button><button class="btn" id="heal">💗 Hồi máu<br><strong id="healprice">40 vàng</strong></button></div><div id="offline"><div><h2>🎁 Thưởng khi vắng mặt</h2><p id="offtext"></p><button class="btn" id="claim" style="width:100%">Nhận thưởng và chơi</button></div></div></main><script>
(()=>{'use strict';const cv=document.getElementById('view'),c=cv.getContext('2d',{alpha:false});const $=id=>document.getElementById(id);const SAVE='slayer_h5_offline_prototype_v1';let s={lvl:1,xp:0,gold:60,atk:12,kills:0,wave:1,hp:100,maxhp:100,last:Date.now()},enemy=null,particles=[],fx=[],shake=0,last=performance.now(),attackWait=0,qCd=0,rCd=0,slash=0,enemyHitCd=0,toastT=0,virtualW=420,virtualH=740;
try{const old=JSON.parse(localStorage.getItem(SAVE)||'null');if(old&&typeof old==='object'){for(const k of Object.keys(s))if(Number.isFinite(old[k]))s[k]=old[k];s.hp=Math.max(1,Math.min(s.maxhp,s.hp));}}catch(e){}
let due=Math.min(8*3600,Math.max(0,(Date.now()-s.last)/1000)),bonus=Math.floor(due/12)*Math.max(1,Math.floor(s.wave/2)+2);let suspended=bonus>0;
if(suspended){$('offtext').textContent=`Đã tu luyện ${Math.floor(due/60)} phút. Nhận ${bonus.toLocaleString('vi-VN')} vàng. Tiến độ vẫn lưu trên thiết bị này.`;$('offline').style.display='flex'}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({...s,last:Date.now()}))}catch(e){}}function rand(a,b){return a+Math.random()*(b-a)}
function say(t){$('tip').textContent=t;toastT=2.4}function spawn(){let boss=s.kills>0&&s.kills%10===0&&s.kills!==s.lastBoss;let base=20+s.wave*9;enemy={x:330,y:402,hp:boss?base*6:base,max:boss?base*6:base,atk:boss?14+s.wave*3:4+s.wave*.65,boss,phase:rand(0,9),color:boss?'#8b4bbb':['#7bc58e','#d1a67b','#b87bab'][Math.floor(rand(0,3))],hit:0};if(boss){s.lastBoss=s.kills;say('⚠️ BOSS XUẤT HIỆN!')}}
function sparks(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-150,150),vy:rand(-200,-10),t:rand(.2,.55),a:1,col:color})}function strike(power=1,mode='normal'){if(!enemy||suspended)return;slash=.22;shake=5;const dmg=Math.max(1,Math.round(s.atk*power*rand(.85,1.18)));enemy.hp-=dmg;enemy.hit=.15;sparks(enemy.x,enemy.y-28,mode==='r'?'#caa6ff':mode==='q'?'#a5eaff':'#ffd98c',mode==='normal'?7:18);fx.push({x:enemy.x,y:enemy.y-55,v:'-'+dmg,t:.6});if(enemy.hp<=0){const reward=(enemy.boss?180:15)+s.wave*7;s.gold+=reward;s.kills++;s.xp+=enemy.boss?120:25;fx.push({x:enemy.x,y:enemy.y-90,v:'+'+reward+' vàng',t:1.2});if(s.kills%5===0)s.wave++;while(s.xp>=s.lvl*85){s.xp-=s.lvl*85;s.lvl++;s.atk+=4;s.maxhp+=12;s.hp=s.maxhp;say('✨ Thăng cấp '+s.lvl+'!')}enemy=null;setTimeout(()=>{if(!enemy&&!suspended)spawn()},240);save()}refresh()}
function refresh(){for(const [id,v]of Object.entries({lvl:s.lvl,gold:s.gold.toLocaleString('vi-VN'),atk:s.atk,wave:s.wave,kills:s.kills,health:Math.round(s.hp)+'/'+s.maxhp}))$(id).textContent=v;$('hpbar').style.width=Math.max(0,s.hp/s.maxhp*100)+'%';$('price').textContent=(40+s.atk*5)+' vàng';$('healprice').textContent=(25+s.lvl*15)+' vàng';$('upgrade').disabled=s.gold<40+s.atk*5;$('heal').disabled=s.gold<25+s.lvl*15||s.hp>=s.maxhp;$('qtext').textContent=qCd>0?qCd.toFixed(1)+'s':'Q';$('rtext').textContent=rCd>0?rCd.toFixed(1)+'s':'R'}
function actQ(){if(qCd>0||!enemy)return;qCd=5;strike(3.5,'q');say('❄️ Kiếm khí!')}function actR(){if(rCd>0||!enemy)return;rCd=12;strike(7,'r');say('🟣 Lôi bạo!')}
$('attack').onclick=()=>strike(1.2);$('q').onclick=actQ;$('r').onclick=actR;$('upgrade').onclick=()=>{let cost=40+s.atk*5;if(s.gold<cost)return;s.gold-=cost;s.atk+=3;say('⚔️ Sát thương +3');refresh();save()};$('heal').onclick=()=>{let cost=25+s.lvl*15;if(s.gold<cost||s.hp>=s.maxhp)return;s.gold-=cost;s.hp=s.maxhp;say('💗 Đã hồi đầy máu');refresh();save()};$('claim').onclick=()=>{s.gold+=bonus;suspended=false;$('offline').style.display='none';refresh();spawn();save()};cv.addEventListener('pointerdown',()=>strike(1.2));document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==='q')actQ();if(k==='r')actR();if(k===' '){e.preventDefault();strike(1.2)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('beforeunload',save);setInterval(save,8000);
function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function line(x,y,xx,yy,col,w=2){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x,y);c.lineTo(xx,yy);c.stroke()}function text(t,x,y,color='#fce6bd',size=14){c.font=`bold ${size}px monospace`;c.fillStyle='#100b20';c.textAlign='center';c.fillText(t,x+1,y+2);c.fillStyle=color;c.fillText(t,x,y)}
function drawHero(t){const x=99,y=406+Math.sin(t*3)*3;rect(x-28,y+17,57,8,'#090c19aa');rect(x-14,y-5,12,30,'#171523');rect(x+3,y-5,12,30,'#171523');rect(x-18,y-47,36,42,'#d5a34b');rect(x-17,y-44,34,28,'#405c97');rect(x-10,y-68,24,22,'#d49a79');rect(x-14,y-73,30,10,'#241d32');rect(x-4,y-78,12,9,'#e9cf87');rect(x-13,y-55,7,5,'#252533');rect(x+8,y-55,7,5,'#252533');rect(x-20,y-38,7,19,'#dba478');rect(x+17,y-38,7,19,'#dba478');line(x+23,y-23,x+37,y-67,'#ecd3a0',5);line(x+26,y-36,x+45,y-83,'#8eeaff',5);line(x+43,y-83,x+27,y-69,'#e8ffff',3);if(slash>0){c.strokeStyle='#fff2a1';c.lineWidth=9;c.beginPath();c.arc(x+46,y-34,52,-1.3,.75);c.stroke();c.strokeStyle='#8cddff';c.lineWidth=4;c.stroke()}}
function drawEnemy(t){if(!enemy)return;const x=enemy.x+Math.sin(t*2+enemy.phase)*7,y=enemy.y;rect(x-27,y+12,65,9,'#07080da8');const b=enemy.boss?1.5:1;c.save();c.translate(x,y);c.scale(b,b);rect(-22,-45,48,39,enemy.hit>0?'#ffedc5':enemy.color);rect(-25,-27,15,34,enemy.color);rect(18,-27,15,34,enemy.color);rect(-17,-8,13,24,'#2a2335');rect(8,-8,13,24,'#2a2335');rect(-15,-67,36,26,enemy.color);rect(-19,-74,9,19,'#f2d296');rect(16,-74,9,19,'#f2d296');rect(-11,-57,6,5,'#fb516e');rect(11,-57,6,5,'#fb516e');rect(-3,-44,13,7,'#342738');c.restore();rect(x-35,y-111,72,9,'#1d1322');rect(x-34,y-110,70*Math.max(0,enemy.hp)/enemy.max,7,enemy.boss?'#ff6279':'#8ce0a0');text(enemy.boss?'BOSS':'MA VẬT',x,y-119,enemy.boss?'#ffb1d3':'#d7d6e9',11)}
function draw(t,dt){const scaleW=cv.width/virtualW,scaleH=cv.height/virtualH;c.setTransform(scaleW,0,0,scaleH,0,0);c.save();c.translate(rand(-shake,shake),rand(-shake,shake));const gr=c.createLinearGradient(0,0,0,740);gr.addColorStop(0,'#13172d');gr.addColorStop(.6,'#2b2751');gr.addColorStop(1,'#17101e');c.fillStyle=gr;c.fillRect(0,0,420,740);for(let i=0;i<48;i++){let x=(i*97.31)%420,y=(i*67.77)%470;c.fillStyle=i%3?'#a0a7d344':'#f8d8ac55';c.fillRect(Math.round(x),Math.round(y),i%5?2:3,i%5?2:3)}for(let i=0;i<6;i++){const x=i*85-55;c.fillStyle=i%2?'#1b2139':'#212b45';c.beginPath();c.moveTo(x,455);c.lineTo(x+58,330+Math.sin(i)*70);c.lineTo(x+150,455);c.fill()}rect(0,428,420,312,'#27273c');for(let y=432;y<740;y+=27){line(0,y,420,y,'#5a4b6688',1);for(let x=(y%54?0:22);x<420;x+=44)rect(x,y+1,3,23,'#5a4c6b44')}rect(0,411,420,24,'#453b55');rect(0,426,420,5,'#9a86a066');c.save();c.globalAlpha=.13;for(let i=0;i<15;i++){let x=(i*41+t*13)%470-30,y=(i*59+t*36)%610;rect(x,y,5,5,'#bde2ff')}c.restore();drawHero(t);drawEnemy(t);if(enemy){line(146,378,enemy.x-46,378,'#b5b6e044',1)}for(const p of particles){rect(p.x,p.y,4,4,p.col)}for(const f of fx){text(f.v,f.x,f.y,'#ffcf82',15)}c.restore();text('S L A Y E R   L E G E N D',210,199,'#ffdc91',20);text('H5 OFFLINE · BẢN DỰNG THỬ',210,223,'#c4b4e3',11)}
function resize(){const d=Math.min(2,devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;cv.width=Math.round(w*d);cv.height=Math.round(h*d)}addEventListener('resize',resize);resize();if(!suspended)spawn();refresh();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;let t=now/1000;if(!suspended){attackWait-=dt;qCd=Math.max(0,qCd-dt);rCd=Math.max(0,rCd-dt);slash=Math.max(0,slash-dt);shake=Math.max(0,shake-80*dt);if(attackWait<=0&&enemy){strike(1);attackWait=.9}if(enemy){enemy.hit=Math.max(0,enemy.hit-dt);enemyHitCd-=dt;if(enemyHitCd<=0){s.hp=Math.max(0,s.hp-enemy.atk);enemyHitCd=2.1;if(s.hp<=0){s.hp=Math.ceil(s.maxhp*.75);s.gold=Math.max(0,s.gold-Math.min(s.gold,10+s.wave*5));say('☠️ Bại trận! Hồi sinh tại điểm bắt đầu.');save()}}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=310*dt;p.t-=dt}particles=particles.filter(x=>x.t>0);for(const f of fx){f.y-=dt*46;f.t-=dt}fx=fx.filter(x=>x.t>0);toastT-=dt;if(toastT<=0)$('tip').textContent='';refresh()}draw(t,dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
